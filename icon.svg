<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd1e8"/>
      <stop offset="1" stop-color="#ff8fc4"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fff7fb"/>
      <stop offset="1" stop-color="#ffe6f1"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>

  <!-- 小蝴蝶结 -->
  <g transform="translate(256 92)">
    <path d="M0 0 L-34 -20 L-34 20 Z" fill="#ff5fa2"/>
    <path d="M0 0 L34 -20 L34 20 Z" fill="#ff5fa2"/>
    <circle r="11" fill="#ff3d8b"/>
  </g>

  <!-- 羊角/耳朵 -->
  <ellipse cx="150" cy="208" rx="34" ry="56" transform="rotate(-22 150 208)" fill="#ffffff"/>
  <ellipse cx="362" cy="208" rx="34" ry="56" transform="rotate(22 362 208)" fill="#ffffff"/>

  <!-- 绒毛（云朵状） -->
  <g fill="#ffffff">
    <circle cx="256" cy="206" r="96"/>
    <circle cx="168" cy="232" r="64"/>
    <circle cx="344" cy="232" r="64"/>
    <circle cx="210" cy="300" r="62"/>
    <circle cx="302" cy="300" r="62"/>
    <circle cx="256" cy="330" r="66"/>
  </g>

  <!-- 脸 -->
  <ellipse cx="256" cy="262" rx="92" ry="82" fill="url(#face)"/>

  <!-- 腮红 -->
  <ellipse cx="196" cy="288" rx="20" ry="13" fill="#ff9ec7" opacity="0.85"/>
  <ellipse cx="316" cy="288" rx="20" ry="13" fill="#ff9ec7" opacity="0.85"/>

  <!-- 眼睛 -->
  <circle cx="222" cy="250" r="11" fill="#3a2b33"/>
  <circle cx="290" cy="250" r="11" fill="#3a2b33"/>
  <circle cx="225" cy="246" r="3.5" fill="#fff"/>
  <circle cx="293" cy="246" r="3.5" fill="#fff"/>

  <!-- 嘴 -->
  <path d="M238 288 Q256 304 274 288" fill="none" stroke="#c96a98" stroke-width="5" stroke-linecap="round"/>

  <!-- 小狗小爪印装饰 -->
  <g fill="#ffffff" opacity="0.92">
    <circle cx="56" cy="430" r="13"/>
    <circle cx="46" cy="412" r="5"/>
    <circle cx="58" cy="408" r="5"/>
    <circle cx="70" cy="414" r="5"/>
  </g>
</svg>
